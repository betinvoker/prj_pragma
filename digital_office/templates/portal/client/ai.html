{% extends 'base.html' %}
{% block content %}
<h2>AI-консультации</h2>
<form method="post">{% csrf_token %}
  <div class="mb-3">
    <label for="question" class="form-label">Задайте вопрос AI</label>
    <textarea id="question" name="question" class="form-control" rows="3"></textarea>
  </div>
  <button class="btn btn-primary" type="submit">Спросить</button>
</form>
<hr>
<h3>История консультаций</h3>
{% for c in consultations %}
  <div class="card mb-2">
    <div class="card-body">
      <strong>Вопрос:</strong> {{ c.question }}<br>
      <strong>Ответ:</strong> {{ c.answer }}
    </div>
  </div>
{% empty %}
  <p>Нет консультаций.</p>
{% endfor %}
{% endblock %}
