{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2>Авторизация</h2>
    {% if form.errors %}
      <div class="alert alert-danger">Неверные учетные данные.</div>
    {% endif %}
    <form method="post">{% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">Войти</button>
    </form>
    <p class="mt-2">Нет учетной записи? <a href="/portal/client/signup/">Регистрация</a></p>
  </div>
</div>
{% endblock %}
